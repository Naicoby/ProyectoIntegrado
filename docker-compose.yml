version: '3.8'

services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: sgc_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sgc_db
      MYSQL_USER: sgc_user
      MYSQL_PASSWORD: sgc_password_2025
      MYSQL_ROOT_PASSWORD: root_password_2025
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para Celery
  redis:
    image: redis:7-alpine
    container_name: sgc_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: